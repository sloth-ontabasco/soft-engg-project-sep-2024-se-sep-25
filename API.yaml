openapi: 3.0.0
info:
  title: System API Specification
  description: API specifications for the student, instructor, TA, and admin views within the system.
  version: 1.0.0

paths:
  /api/users:
    get:
      tags:
        - User
      summary: Retrieve all users
      description: Fetch details of all users (admin only).
      operationId: getAllUsers
      responses:
        '200':
          description: Users found successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '403':
          description: Unauthorized access
          content:
            application/json:
              example:
                "success": false
                "message": "Unauthorized access"
                "code": 403


  /api/users/{user_id}:
    get:
      tags:
        - User
      summary: Retrieve user details
      description: Fetch details of a specific user by ID.
      operationId: getUserById
      parameters:
        - name: user_id
          in: path
          description: User ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              example:
                success: false
                message: User not found
                code: 404

    put:
      tags:
        - User
      summary: Update user details
      description: Update details of a specific user by ID.
      operationId: updateUser
      parameters:
        - name: user_id
          in: path
          description: User ID
          required: true
          schema:
            type: string
      requestBody:
        description: User details to update
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: New username
                github_id:
                  type: string
                  description: New GitHub ID
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Unauthorized access
          content:
            application/json:
              example:
                "success": false
                "message": "Unauthorized access"
                "code": 403

    delete:
      tags:
        - User
      summary: Delete a user
      description: Delete a specific user by ID.
      operationId: deleteUser
      parameters:
        - name: user_id
          in: path
          description: User ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: Role is not allowed.
        '404':
          description: User not found
          content:
            application/json:
              example:
                success: false
                message: User not found
                code: 404


  /api/{project_id}/teams:
    get:
      tags:
        - Team
      summary: Retrieve teams for a project
      description: Fetch all teams for a project or a specific team for a student.
      operationId: getTeamsByProject
      parameters:
        - name: project_id
          in: path
          description: Project ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Team found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '403':
          description: Unauthorized access
          content:
            application/json:
              example:
                success: false
                message: Unauthorized access
                code: 403
        '404':
          description: Project or team not found
          content:
            application/json:
              example:
                success: false
                message: Project or team not found
                code: 404

    post:
      tags:
        - Team
      summary: Create a new team
      description: Create a team for the specified project.
      operationId: createTeam
      parameters:
        - name: project_id
          in: path
          description: Project ID
          required: true
          schema:
            type: string
      requestBody:
        description: Team details to create
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team_name:
                  type: string
                  description: Team name
                members:
                  type: array
                  items:
                    type: string
                    format: email
                    description: Email ID of the team member
      responses:
        '201':
          description: Team created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '400':
          description: Validation error
          content:
            application/json:
              example:
                success: false
                message: "Missing required fields: team_name, members"
                code: 400
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: Role not allowed.
        '404':
          description: Project or user not found
          content:
            application/json:
              example:
                success: false
                message: Project not found
                code: 404


  /api/{project_id}/teams/{team_id}:
    put:
      tags:
        - Team
      summary: Update team details
      description: Update details of a specific team by ID.
      operationId: updateTeam
      parameters:
        - name: project_id
          in: path
          description: Project ID
          required: true
          schema:
            type: string
        - name: team_id
          in: path
          description: Team ID
          required: true
          schema:
            type: string
      requestBody:
        description: Team details to update
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team_name:
                  type: string
                  description: New team name
                members:
                  type: array
                  items:
                    type: string
                    format: email
                    description: Email ID of the team member
      responses:
        '200':
          description: Team updated successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
        '400':
          description: Validation error
          content:
            application/json:
              example:
                success: false
                message: "Request body is missing"
                code: 400
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: Role not allowed.
        '404':
          description: Project, team or user not found
          content:
            application/json:
              example:
                success: false
                message: Project not found
                code: 404

    delete:
      tags:
        - Team
      summary: Delete a team
      description: Delete a specific team by ID.
      operationId: deleteTeam
      parameters:
        - name: project_id
          in: path
          description: Project ID
          required: true
          schema:
            type: string
        - name: team_id
          in: path
          description: Team ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Team deleted successfully
          content:
            application/json:
              example:
                success: true
                message: Team deleted successfully
                code: 200
        '401':
          description: Unauthorized
          content:
            application/json:
              example:
                message: Role not allowed.
        '404':
          description: Project, team or user not found
          content:
            application/json:
              example:
                success: false
                message: Project not found
                code: 404







  /api/project/milestones/{projectId}:
    get:
      tags:
        - Milestone
      summary: Retrieve milestones for a project.
      description: View the details of the milestones for a project.
      parameters:
        - name: projectId
          in: path
          required: true
          description: The ID of the project.
          schema:
            type: string
      responses:
            "200":
              description: Request processed successfully.
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: Request processed successfully
                      code:
                        type: integer
                        example: 200
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: 6739c50a5658280e7567203f
                            title:
                              type: string
                              example: Milestone 1
                            description:
                              type: string
                              example: Description for Milestone 1
                            due_date:
                              type: string
                              format: date-time
                              example: "2024-06-30T00:00:00"
                            project:
                              type: string
                              example: 6739736b7618cd3a00d4e9b5
                            created_at:
                              type: string
                              format: date-time
                              example: "2024-11-17T10:27:22.010000"
                            updated_at:
                              type: string
                              format: date-time
                              example: "2024-11-17T10:27:22.010000"
                  
            "404":
              description:  not found.
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: project not found
                      code:
                        type: integer
                        example: 404

    post:
      tags:
        - Milestone
      summary: adds a milestone to the project
      description:  adds a milestone to the project using projectId.
      parameters:
        - name: projectId
          in: path
          required: true
          description: The ID of the project.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Milestone 1 testing
                description:
                  type: string
                  example: This is the first milestone.
                due_date:
                  type: string
                  example: "12/31/24 23:59:59"
      responses:
        "200":
          description: Milestone added successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Milestone added successfully
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 673c4a6788adbf17d4ce88e2
                      title:
                        type: string
                        example: Milestone 1 testing
                      description:
                        type: string
                        example: This is the first milestone.
                      due_date:
                        type: string
                        format: date-time
                        example: "2024-12-31T23:59:59"
                      project:
                        type: string
                        example: 673a1a914ad37936cc72655c
                      created_at:
                        type: string
                        format: date-time
                        example: "2024-11-19T08:20:55.449397"
                      updated_at:
                        type: string
                        format: date-time
                        example: "2024-11-19T08:20:55.449397"
        "404":
            description:  project not found.
            content:
              application/json:
                schema:
                  type: object
                  properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: project not found
                      code:
                        type: integer
                        example: 404
      
      
                        
  /api/milestones/{milestoneId}:
    get:
      tags:
        - Milestone
      summary: Retrieve milestone details.
      description: View the details of the current milestone.
      parameters:
        - name: milestoneId
          in: path
          required: true
          description: The ID of the milestone.
          schema:
            type: string
      responses:
            "200":
              description: Request processed successfully.
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: Request processed successfully
                      code:
                        type: integer
                        example: 200
                      data:
                        type: object
                        properties:
                          title:
                            type: string
                            example: Milestone 2
                          description:
                            type: string
                            example: Description for Milestone 2
                          due_date:
                            type: string
                            format: date-time
                            example: '2024-07-31T00:00:00'
                          project:
                            type: string
                            example: 6739736b7618cd3a00d4e9b5
                          created_at:
                            type: string
                            format: date-time
                            example: '2024-11-17T10:27:22.243000'
                          updated_at:
                            type: string
                            format: date-time
                            example: '2024-11-17T10:27:22.243000'
            "404":
              description: Milestone not found.
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: Milestone not found
                      code:
                        type: integer
                        example: 404
                        
  /api/milestones/{project_id}/{milestone_id}:
    put:
      tags:
        - Milestone
      summary: Update a milestone.
      description: Update the details of a milestone for a specific project.
      parameters:
        - name: project_id
          in: path
          required: true
          description: The ID of the project.
          schema:
            type: string
        - name: milestone_id
          in: path
          required: true
          description: The ID of the milestone.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "Updated Milestone Title"
                description:
                  type: string
                  example: "This is an updated description of the milestone."
                due_date:
                  type: string
                  example: "12/31/24 23:59:59"
      responses:
        "200":
          description: Milestone updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Milestone updated successfully
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "673c4a6788adbf17d4ce88e2"
                      title:
                        type: string
                        example: "Updated Milestone Title"
                      description:
                        type: string
                        example: "This is an updated description of the milestone."
                      due_date:
                        type: string
                        format: date-time
                        example: "2024-12-31T23:59:59"
                      project:
                        type: string
                        example: "673a1a914ad37936cc72655c"
                      created_at:
                        type: string
                        format: date-time
                        example: "2024-11-19T08:20:55.449000"
                      updated_at:
                        type: string
                        format: date-time
                        example: "2024-11-19T09:05:25.947819"
              examples:
                success:
                  value:
                    success: true
                    message: Milestone updated successfully
                    code: 200
                    data:
                      id: "673c4a6788adbf17d4ce88e2"
                      title: "Updated Milestone Title"
                      description: "This is an updated description of the milestone."
                      due_date: "2024-12-31T23:59:59"
                      project: "673a1a914ad37936cc72655c"
                      created_at: "2024-11-19T08:20:55.449000"
                      updated_at: "2024-11-19T09:05:25.947819"
        "404":
          description: Milestone not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Milestone not found
                  code:
                    type: integer
                    example: 404
              examples:
                milestone_not_found:
                  value:
                    success: false
                    message: Milestone not found
                    code: 404
                project_not_found:
                  value:
                    success: false
                    message: Project not found
                    code: 404
  
    delete:
      tags:
        - Milestone
      summary: Delete a milestone.
      description: Delete a specific milestone for a project.
      parameters:
        - name: project_id
          in: path
          required: true
          description: The ID of the project.
          schema:
            type: string
        - name: milestone_id
          in: path
          required: true
          description: The ID of the milestone.
          schema:
            type: string
      responses:
        "200":
          description: Milestone deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Milestone deleted successfully
                  code:
                    type: integer
                    example: 200
              examples:
                success:
                  value:
                    success: true
                    message: Milestone deleted successfully
                    code: 200
        "404":
          description: Resource not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Milestone not found
                  code:
                    type: integer
                    example: 404
              examples:
                milestone_not_found:
                  value:
                    success: false
                    message: Milestone not found
                    code: 404
                project_not_found:
                  value:
                    success: false
                    message: Project not found
                    code: 404


                        
    
  /api/project:
    get:
      tags:
        - Project
      summary: Retrieve all projects.
      description: Get a list of all projects with their details and associated milestones.
      responses:
        "200":
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Request processed successfully
                  code:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 6739736b7618cd3a00d4e9b5
                        title:
                          type: string
                          example: Project Alpha
                        description:
                          type: string
                          example: Description for Project Alpha
                        deadline:
                          type: string
                          format: date-time
                          example: "2024-12-31T00:00:00"
                        mentors:
                          type: array
                          items:
                            type: string
                          example: []
                        created_at:
                          type: string
                          format: date-time
                          example: "2024-11-17T04:39:07.432000"
                        updated_at:
                          type: string
                          format: date-time
                          example: "2024-11-17T04:39:07.432000"
                        milestones:
                          type: array
                          items:
                            type: string
                          example: [
                            "6739c50a5658280e7567203f",
                            "6739c50a5658280e75672040",
                            "6739c50a5658280e75672041",
                            "6739c565c87af9b20a0ab4d4",
                            "6739c565c87af9b20a0ab4d5",
                            "6739c565c87af9b20a0ab4d6"
                          ]
              examples:
                success:
                  value:
                    success: true
                    message: Request processed successfully
                    code: 200
                    data:
                      - id: 6739736b7618cd3a00d4e9b5
                        title: Project Alpha
                        description: Description for Project Alpha
                        deadline: "2024-12-31T00:00:00"
                        mentors: []
                        created_at: "2024-11-17T04:39:07.432000"
                        updated_at: "2024-11-17T04:39:07.432000"
                        milestones:
                          - 6739c50a5658280e7567203f
                          - 6739c50a5658280e75672040
                          - 6739c50a5658280e75672041
                          - 6739c565c87af9b20a0ab4d4
                          - 6739c565c87af9b20a0ab4d5
                          - 6739c565c87af9b20a0ab4d6
                      - id: 6739736c7618cd3a00d4e9b6
                        title: Project Beta
                        description: Description for Project Beta
                        deadline: "2024-11-30T00:00:00"
                        mentors: []
                        created_at: "2024-11-17T04:39:08.165000"
                        updated_at: "2024-11-17T04:39:08.165000"
                        milestones: []
 
    post:
      tags:
        - Project
      summary: Create a new project.
      description: Add a new project with its details and associated mentors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: The title of the project.
                  example: New Project
                description:
                  type: string
                  description: A description of the project.
                  example: This is a description of the new project.
                deadline:
                  type: string
                  format: date-time
                  description: The deadline for the project.
                  example: "2024-12-31T23:59:59"
                mentors:
                  type: array
                  items:
                    type: string
                  description: A list of mentor IDs associated with the project.
                  example: ["672a2e5508de9792700b3c1b"]
              required:
                - title
                - description
                - deadline
      responses:
        "200":
          description: Project created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Project created successfully
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 673c67c6bcf9c55e26d2604f
                      title:
                        type: string
                        example: New Project
                      description:
                        type: string
                        example: This is a description of the new project.
                      deadline:
                        type: string
                        format: date-time
                        example: "2024-12-31T23:59:59"
                      mentors:
                        type: array
                        items:
                          type: string
                        example: ["672a2e5508de9792700b3c1b"]
                      created_at:
                        type: string
                        format: date-time
                        example: "2024-11-19T10:26:14.110337"
                      updated_at:
                        type: string
                        format: date-time
                        example: "2024-11-19T10:26:14.110337"
                      milestones:
                        type: array
                        items:
                          type: string
                        example: []
        "400":
          description: Missing required field in the input.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Missing required field - title
                  code:
                    type: integer
                    example: 400

  /api/projects/user/{user_id}:
    get:
      tags:
        - Project
      summary: Retrieve projects for a specific user.
      description: Fetch the list of projects associated with a user by their user ID.
      parameters:
        - name: user_id
          in: path
          required: true
          description: The ID of the user whose projects are to be fetched.
          schema:
            type: string
      responses:
        "200":
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Request processed successfully
                  code:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "6739a225f820acac986de4e5"
                        title:
                          type: string
                          example: "New Project2"
                        description:
                          type: string
                          example: "This is a description of the new project."
                        deadline:
                          type: string
                          format: date-time
                          example: "2024-12-31T23:59:59"
                        mentors:
                          type: array
                          items:
                            type: string
                          example:
                            - "672a2e5508de9792700b3c1b"
                            - "672dd5186cc42a25f60ec26e"
                        created_at:
                          type: string
                          format: date-time
                          example: "2024-11-17T07:58:29.765000"
                        updated_at:
                          type: string
                          format: date-time
                          example: "2024-11-17T07:58:29.765000"
                        milestones:
                          type: array
                          items:
                            type: string
                          example: []
  /api/project/{project_id}:
    get:
      tags:
        - Project
      summary: Retrieve a project by its ID.
      description: Fetch the details of a specific project using its project ID.
      parameters:
        - name: project_id
          in: path
          required: true
          description: The ID of the project to be retrieved.
          schema:
            type: string
      responses:
        "200":
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Request processed successfully"
                  code:
                    type: integer
                    example: 200
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "6739736c7618cd3a00d4e9b6"
                      title:
                        type: string
                        example: "Project Beta"
                      description:
