components:
  schemas:
    User:
        type: object
        properties:
          id:
            type: string
            description: Unique identifier for the user
          username:
            type: string
            description: Username of the user
          email:
            type: string
            format: email
            description: Email address of the user
          github_id:
            type: string
            nullable: true
            description: GitHub ID of the user, if available
          role:
            type: string
            description: Role of the user (e.g., student, admin, etc.)
          status:
            type: integer
            description: Status of the user (e.g., active, inactive)
    Team:
        type: object
        properties:
          id:
            type: string
            description: Unique identifier for the team
          team_name:
            type: string
            description: Name of the team
          project_status:
            type: string
            nullable: true
            description: Current status of the project associated with the team
          grade:
            type: string
            nullable: true
            description: Grade of the team for the project, if available
          project_id:
            type: string
            description: Unique identifier for the project associated with the team
          project_title:
            type: string
            description: Title of the project associated with the team
          members:
            type: array
            items:
              type: string
              format: email
              description: Email addresses of team members
          created_at:
            type: string
            format: date-time
            description: Timestamp when the team was created
          updated_at:
            type: string
            format: date-time
            description: Timestamp when the team was last updated
            
    securitySchemes:
      jwtAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT

             